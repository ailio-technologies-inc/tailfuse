[workspace]
members = [
    "crates/tailfuse-core",
    "crates/tailfuse-cli",
    "crates/licgen",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.33"
edition = "2021"
license = "MIT"

# One release profile for the whole workspace, the app included (a member's own
# [profile] is ignored). Thin LTO: most of fat LTO's size and speed, without
# re-optimising the whole Tauri dependency tree as one unit on every release
# build (that was minutes per target, twice on the universal macOS build).
[profile.release]
lto = "thin"
strip = true
