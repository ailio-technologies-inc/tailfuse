[package]
name = "tailfuse-app"
version = "0.1.0"
description = "tailfuse — connect to multiple Tailscale tailnets at once"
authors = ["Ailio Technologies Inc."]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
tailfuse-core = { path = "../../crates/tailfuse-core" }
