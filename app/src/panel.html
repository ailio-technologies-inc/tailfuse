<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-buttons="pill">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailfuse</title>
    <link rel="stylesheet" href="assets/kit/system.css" />
    <link rel="stylesheet" href="assets/kit/motion.css" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="panel">
      <header class="p-head">
        <svg viewBox="120 146 272 220" width="20" height="16" aria-hidden="true"><circle cx="150" cy="176" r="27" fill="#eff0f1"/><circle cx="150" cy="256" r="27" fill="#eff0f1"/><circle cx="150" cy="336" r="27" fill="#eff0f1"/><circle cx="214" cy="176" r="27" fill="#eff0f1"/><circle cx="214" cy="336" r="27" fill="#eff0f1"/><circle cx="298" cy="176" r="27" fill="#ff4a1f"/><circle cx="362" cy="176" r="27" fill="#ff4a1f"/><circle cx="298" cy="336" r="27" fill="#ff4a1f"/><circle cx="362" cy="256" r="27" fill="#ff4a1f"/><circle cx="362" cy="336" r="27" fill="#ff4a1f"/><rect x="191" y="229" width="130" height="54" rx="27" fill="#ff4a1f"/></svg>
        <strong>Tailfuse</strong>
        <span id="state" class="pill">Stopped</span>
        <label class="switch" title="Start or stop Tailfuse">
          <input type="checkbox" id="power" aria-label="Start or stop Tailfuse" />
          <span class="slider"></span>
        </label>
      </header>

      <ul id="profiles" class="list"></ul>
      <p id="empty" class="hint" hidden>No tailnets yet — open Tailfuse to add one.</p>

      <footer class="p-foot">
        <button id="open" class="btn btn--secondary btn--sm">Open Tailfuse</button>
        <button id="quit" class="btn btn--sm btn--ghost">Quit</button>
      </footer>
    </div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
