<!doctype html>
<html lang="en" data-type="software" data-radius="soft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tailfuse</title>
    <meta name="description" content="tailfuse connects a Mac or Windows machine to several Tailscale tailnets at once, routing each name to its own tailnet." />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <link rel="stylesheet" href="assets/kit/system.css" />
    <link rel="stylesheet" href="assets/kit/motion.css" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- plan: kind software · palette limewash-ochre (dealt; warm limewash ground, ochre accent — the material of a bench tool) · type chivo (neo-grotesk + matching mono, developer tool) · radius soft · one window, no hero/sections: a utility window the kit's page rhythm does not apply to (waived in .taste-skill/waivers.json) -->
    <header class="titlebar">
      <div class="brand">
        <h1>tailfuse</h1>
        <span id="license" class="license"></span>
      </div>
      <div class="header-actions">
        <label class="switch" title="Start or stop tailfuse">
          <input type="checkbox" id="power" aria-label="Start or stop tailfuse" />
          <span class="slider"></span>
        </label>
        <span id="power-label" class="power-label">Stopped</span>
      </div>
    </header>

    <div class="body">
      <section class="pane" aria-labelledby="tailnets-h">
        <div class="pane-head">
          <h2 id="tailnets-h">Tailnets</h2>
          <div class="pane-tools">
            <button id="import" type="button" class="btn btn--secondary btn--sm" title="Add the tailnet this Mac's Tailscale app is signed in to">Import from Tailscale</button>
            <form id="add-profile" class="inline-form">
              <span class="field"><input id="p-name" placeholder="work" required aria-label="Profile name" /></span>
              <span class="field"><input id="p-suffix" placeholder=".work.ts.net" required aria-label="Hostname suffix" /></span>
              <button type="submit" class="btn btn--primary btn--sm">Add profile</button>
            </form>
          </div>
        </div>
        <ul id="profiles" class="list"></ul>
        <p class="hint" id="profile-hint"></p>
        <p class="hint" id="import-msg" role="status"></p>
      </section>

      <section class="pane" aria-labelledby="tunnels-h">
        <div class="pane-head">
          <h2 id="tunnels-h">Tunnels</h2>
          <form id="add-tunnel" class="inline-form">
            <span class="field"><input id="t-name" placeholder="prod-db" required aria-label="Tunnel name" /></span>
            <span class="field"><input id="t-listen" placeholder="127.0.0.1:5432" required aria-label="Local listen address" /></span>
            <span class="field"><input id="t-target" placeholder="db.work.ts.net:5432" required aria-label="Remote target" /></span>
            <span class="field"><input id="t-profile" placeholder="work" required aria-label="Profile" /></span>
            <button type="submit" class="btn btn--primary btn--sm">Add tunnel</button>
          </form>
        </div>
        <ul id="tunnels" class="list"></ul>
      </section>

      <section class="pane pane--footer" aria-label="Browser routing, license and startup">
        <div>
          <h2>Browser routing</h2>
          <p>
            PAC URL: <code id="pac-url"></code><br />
            The app sets the system PAC on start (macOS/Windows) and clears its
            own setting on quit. Unowned hostnames are always refused.
          </p>
          <form id="test-host" class="inline-form">
            <span class="field"><input id="test-input" placeholder="nas.home-lab.ts.net" aria-label="Hostname to test" /></span>
            <button type="submit" class="btn btn--secondary btn--sm">Test routing</button>
            <span id="test-result" class="hint"></span>
          </form>
        </div>
        <div>
          <h2>License &amp; startup</h2>
          <form id="activate" class="inline-form">
            <span class="field"><input id="license-key" placeholder="tailfuse_…" class="wide" aria-label="License key" /></span>
            <button type="submit" class="btn btn--primary btn--sm">Activate</button>
          </form>
          <p id="license-msg" class="hint" role="status"></p>
          <label class="check">
            <input type="checkbox" id="autostart" />
            <span>Open tailfuse at login</span>
          </label>
        </div>
      </section>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
