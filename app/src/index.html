<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tailfuse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="6" cy="12" r="2.6" />
            <circle cx="18" cy="6" r="2.6" />
            <circle cx="18" cy="18" r="2.6" />
            <path d="M8.3 10.8 15.7 7.2M8.3 13.2 15.7 16.8" />
          </svg>
        </div>
        <div>
          <h1>tailfuse</h1>
          <span id="license" class="license"></span>
        </div>
      </div>
      <div class="header-actions">
        <label class="switch" title="Start or stop tailfuse">
          <input type="checkbox" id="power" />
          <span class="slider"></span>
        </label>
        <span id="power-label" class="power-label">Stopped</span>
      </div>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>Tailnets</h2>
          <form id="add-profile" class="inline-form">
            <input id="p-name" placeholder="name" required />
            <input id="p-suffix" placeholder=".work.ts.net" required />
            <button type="submit">Add profile</button>
          </form>
        </div>
        <ul id="profiles" class="cards"></ul>
        <p class="hint" id="profile-hint"></p>
      </section>

      <section>
        <div class="section-head">
          <h2>Tunnels</h2>
          <form id="add-tunnel" class="inline-form">
            <input id="t-name" placeholder="name" required />
            <input id="t-listen" placeholder="127.0.0.1:5432" required />
            <input id="t-target" placeholder="db.work.ts.net:5432" required />
            <input id="t-profile" placeholder="profile" required />
            <button type="submit">Add tunnel</button>
          </form>
        </div>
        <ul id="tunnels" class="cards"></ul>
      </section>

      <section class="footer-info">
        <div>
          <h2>Browser routing</h2>
          <p>
            PAC URL: <code id="pac-url"></code><br />
            The app sets the system PAC on start (macOS/Windows) and clears its
            own setting on quit. Unowned hostnames are always refused.
          </p>
          <form id="test-host" class="inline-form">
            <input id="test-input" placeholder="nas.home-lab.ts.net" />
            <button type="submit">Test routing</button>
            <span id="test-result"></span>
          </form>
        </div>
        <div>
          <h2>License &amp; startup</h2>
          <form id="activate" class="inline-form">
            <input id="license-key" placeholder="tailfuse_…" class="wide" />
            <button type="submit">Activate</button>
          </form>
          <p id="license-msg" class="hint"></p>
          <label class="check">
            <input type="checkbox" id="autostart" />
            <span>Open tailfuse at login</span>
          </label>
        </div>
      </section>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
