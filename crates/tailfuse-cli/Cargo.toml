[package]
name = "tailfuse-cli"
description = "tailfuse command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tailfuse"
path = "src/main.rs"

[dependencies]
tailfuse-core = { path = "../tailfuse-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde-saphyr = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
