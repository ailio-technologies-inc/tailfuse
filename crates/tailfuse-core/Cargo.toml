[package]
name = "tailfuse-core"
description = "Core library: multi-tailnet profile management, loopback router, PAC, tunnels, licensing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1"
anyhow = "1"
ed25519-dalek = "2"
base64 = "0.22"
tracing = "0.1"
dirs = "6"
rand = "0.8"
