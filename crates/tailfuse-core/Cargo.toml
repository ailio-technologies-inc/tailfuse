[package]
name = "tailfuse-core"
description = "Core library: multi-tailnet profile management, loopback router, PAC, tunnels, licensing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
anyhow = "1"
ed25519-dalek = "2"
base64 = "0.22"
tracing = "0.1"
dirs = "6"
rand = "0.8"

# Secrets (auth keys, the license key) live in the OS credential store where there is one.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
