[package]
name = "licgen"
description = "License key signer for tailfuse (vendor-only tool)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licgen"
path = "src/main.rs"

[dependencies]
tailfuse-core = { path = "../tailfuse-core" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
chrono = "0.4"
serde_json = "1"
