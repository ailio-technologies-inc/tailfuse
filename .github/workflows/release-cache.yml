name: Release cache

# Keeps the release build's Rust cache warm. A tag run (release.yml) can only
# restore caches saved from the default branch, never another tag's, so without
# this every release compiled every dependency from scratch (~10 min a platform).
# Each job here builds what its release job builds, with the same shared-key,
# and saves the result for the next tag to restore.

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/package-lock.json"
      - .github/workflows/release-cache.yml
  workflow_dispatch:

concurrency:
  group: release-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-linux-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cd apps/desktop && npm ci && npx tauri build --no-bundle
