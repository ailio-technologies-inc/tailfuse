name: Release

# The Linux menu-bar app. The CLI archives and the macOS and Windows app
# installers are built by the cluster (infra docs/agents/tailfuse-release.md).
# Whichever lane runs first creates the release; each uploads only its own
# assets.
#
# Each OS job ships two things: the `tailfuse` CLI archive and the menu-bar app
# installer (tailfuse-app-<tag>-...: .dmg, -setup.exe, .AppImage, .deb),
# which is what tailfuse.com/download hands out. The app is not code-signed
# yet: macOS gets an ad-hoc signature (tauri.conf.json), Windows none.
#
# A run that is not on a tag (workflow_dispatch on a branch) builds everything
# and keeps the installers as workflow artifacts, without touching a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux menu-bar app only. CLI archives and the macOS and Windows installers
  # are cluster lanes.
  # macOS: tailfuse-release-macos, after a UPLOAD=0 rehearsal on the mini
  # (2026-11-16).
  # Windows: tailfuse-release-windows.
  build-linux-app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Restores the cache that release-cache.yml keeps warm on main (a tag
      # can't read another tag's cache, only main's). Tags don't save their own.
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-linux-app
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build the menu-bar app (.AppImage and .deb)
        env:
          # Signs updater artifacts (.sig); the public half is in
          # tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) VERSION=0.0.0 ;; esac
          cd apps/desktop
          npm ci
          npx tauri build --bundles appimage,deb \
            --config "{\"version\":\"$VERSION\"}"
          mkdir -p ../../dist
          ASSET="tailfuse-app-${GITHUB_REF_NAME//\//-}-linux-amd64"
          cp ../../target/release/bundle/appimage/*.AppImage \
            "../../dist/${ASSET}.AppImage"
          cp ../../target/release/bundle/appimage/*.AppImage.sig \
            "../../dist/${ASSET}.AppImage.sig"
          cp ../../target/release/bundle/deb/*.deb "../../dist/${ASSET}.deb"
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: tailfuse-app-linux
          path: dist/tailfuse-app-*
      - name: Create release if absent
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            || gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "tailfuse ${{ github.ref_name }}" --generate-notes
      - name: Upload Linux app assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum \
            tailfuse-app-${{ github.ref_name }}-linux-amd64.AppImage \
            tailfuse-app-${{ github.ref_name }}-linux-amd64.deb \
            > SHA256SUMS-linux-app.txt
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --clobber \
            tailfuse-app-${{ github.ref_name }}-linux-amd64.AppImage \
            tailfuse-app-${{ github.ref_name }}-linux-amd64.AppImage.sig \
            tailfuse-app-${{ github.ref_name }}-linux-amd64.deb \
            SHA256SUMS-linux-app.txt
