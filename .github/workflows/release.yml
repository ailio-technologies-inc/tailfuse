name: Release

# The macOS + Windows lane of tailfuse's release: the Linux CLI assets are built
# and published by the cluster's dagu lane (infra/bake-host/dags/tailfuse-release.yaml,
# docs/agents/tailfuse-release.md). Whichever lane runs first creates the
# release; each uploads only its own assets.
#
# Each OS job ships two things: the `tailfuse` CLI archive and the menu-bar app
# installer (tailfuse-app-<tag>-...: .dmg, -setup.exe, .AppImage, .deb), which is
# what tailfuse.com/download hands out. The app is not code-signed yet: macOS
# gets an ad-hoc signature (tauri.conf.json), Windows none.
#
# A run that is not on a tag (workflow_dispatch on a branch) builds everything
# and keeps the installers as workflow artifacts, without touching a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release -p tailfuse-cli --target aarch64-apple-darwin
      - run: cargo build --release -p tailfuse-cli --target x86_64-apple-darwin
      - name: Package universal binary
        run: |
          mkdir dist
          lipo -create -output dist/tailfuse target/aarch64-apple-darwin/release/tailfuse target/x86_64-apple-darwin/release/tailfuse
          tar -czf dist/tailfuse-${{ github.ref_name }}-macos-universal.tar.gz -C dist tailfuse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the menu-bar app (universal .dmg)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) VERSION=0.0.0 ;; esac
          cd app
          npm ci
          # No Developer ID certificate here: sign ad hoc. The cluster's release lane (infra:
          # host/tailfuse-notarize) takes the .app.tar.gz, signs it with the Developer ID,
          # notarizes and staples it, publishes it as ...-macos-universal.zip, and removes
          # this ad-hoc dmg and the .app.tar.gz from the release.
          npx tauri build --target universal-apple-darwin --bundles app,dmg --config "{\"version\":\"$VERSION\",\"bundle\":{\"macOS\":{\"signingIdentity\":\"-\"}}}"
          cp ../target/universal-apple-darwin/release/bundle/dmg/*.dmg "../dist/tailfuse-app-${GITHUB_REF_NAME//\//-}-macos-universal.dmg"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "../dist/tailfuse-app-${GITHUB_REF_NAME//\//-}-macos-universal.app.tar.gz" -C ../target/universal-apple-darwin/release/bundle/macos Tailfuse.app
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: tailfuse-app-macos
          path: dist/tailfuse-app-*.dmg
      - name: Create release if absent
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
          || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "tailfuse ${{ github.ref_name }}" --generate-notes
      - name: Upload macOS assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 tailfuse-${{ github.ref_name }}-macos-universal.tar.gz tailfuse-app-${{ github.ref_name }}-macos-universal.dmg > SHA256SUMS-macos.txt
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber tailfuse-${{ github.ref_name }}-macos-universal.tar.gz tailfuse-app-${{ github.ref_name }}-macos-universal.dmg SHA256SUMS-macos.txt
          # Last, on its own: the cluster's notarize step starts when this file appears, so
          # everything above is already uploaded by then.
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber tailfuse-app-${{ github.ref_name }}-macos-universal.app.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release -p tailfuse-cli --target x86_64-pc-windows-msvc
      - name: Package
        run: |
          mkdir dist
          copy target\x86_64-pc-windows-msvc\release\tailfuse.exe dist\tailfuse.exe
          Compress-Archive -Path dist\tailfuse.exe -DestinationPath dist\tailfuse-${{ github.ref_name }}-windows-x86_64.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the menu-bar app (NSIS installer)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) VERSION=0.0.0 ;; esac
          cd app
          npm ci
          npx tauri build --bundles nsis --config "{\"version\":\"$VERSION\"}"
          cp ../target/release/bundle/nsis/*-setup.exe "../dist/tailfuse-app-${GITHUB_REF_NAME//\//-}-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: tailfuse-app-windows
          path: dist/tailfuse-app-*-setup.exe
      - name: Create release if absent
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" || `
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "tailfuse ${{ github.ref_name }}" --generate-notes
      - name: Upload Windows assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum tailfuse-${{ github.ref_name }}-windows-x86_64.zip tailfuse-app-${{ github.ref_name }}-windows-x86_64-setup.exe > SHA256SUMS-windows.txt
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber tailfuse-${{ github.ref_name }}-windows-x86_64.zip tailfuse-app-${{ github.ref_name }}-windows-x86_64-setup.exe SHA256SUMS-windows.txt

  # The Linux menu-bar app only. The Linux CLI archives stay on the cluster lane.
  build-linux-app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build the menu-bar app (.AppImage and .deb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) VERSION=0.0.0 ;; esac
          cd app
          npm ci
          npx tauri build --bundles appimage,deb --config "{\"version\":\"$VERSION\"}"
          mkdir -p ../dist
          cp ../target/release/bundle/appimage/*.AppImage "../dist/tailfuse-app-${GITHUB_REF_NAME//\//-}-linux-amd64.AppImage"
          cp ../target/release/bundle/deb/*.deb "../dist/tailfuse-app-${GITHUB_REF_NAME//\//-}-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: tailfuse-app-linux
          path: dist/tailfuse-app-*
      - name: Create release if absent
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
          || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "tailfuse ${{ github.ref_name }}" --generate-notes
      - name: Upload Linux app assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum tailfuse-app-${{ github.ref_name }}-linux-amd64.AppImage tailfuse-app-${{ github.ref_name }}-linux-amd64.deb > SHA256SUMS-linux-app.txt
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber tailfuse-app-${{ github.ref_name }}-linux-amd64.AppImage tailfuse-app-${{ github.ref_name }}-linux-amd64.deb SHA256SUMS-linux-app.txt
